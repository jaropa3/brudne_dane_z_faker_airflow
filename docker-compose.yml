# ================================================================
# docker-compose up --build
# Airflow UI: http://localhost:8080  (admin / admin)
# PostgreSQL:  localhost:5432  (baza ETL: postgres, baza meta: airflow)
#
# Przed pierwszym uruchomieniem wygeneruj AIRFLOW_FERNET_KEY:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# i dodaj do .env: AIRFLOW_FERNET_KEY=<wynik>
# ================================================================

x-airflow-common: &airflow-common
  build: .
  image: orders-etl-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-only-change-in-prod}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Zmienne ETL — przekazane do kontenerów z pliku .env
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    POSTGRES_HOST: postgres
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src      # mount nadpisuje kopię z obrazu — zmiany w src/ od razu widoczne
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs  # named volume — Docker zarządza uprawnieniami
  depends_on: &postgres-healthy
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------
  # PostgreSQL — jedna instancja dla bazy ETL (postgres) i meta (airflow)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01_init.sh
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Jednorazowa inicjalizacja Airflow (migracja DB + konto admina)
  # ------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        (airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true)
    environment:
      <<: *airflow-env
    restart: on-failure

  # ------------------------------------------------------------------
  # Airflow Webserver — UI na http://localhost:8080
  # ------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Airflow Scheduler — uruchamia DAG-i zgodnie z harmonogramem
  # ------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
